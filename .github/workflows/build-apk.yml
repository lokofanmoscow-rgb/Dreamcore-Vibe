name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install web dependencies
        run: npm ci
      - name: Bundle game
        run: npm run build
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null
      - name: Build APK
        run: tools/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DreamcoreVibe-apk
          path: dist/DreamcoreVibe.apk
